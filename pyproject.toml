[project]
name = "idea_stress_tester"
version = "0.1.0"
description = "idea_stress_tester using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.15,<2.0.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.61.1",
]

[project.scripts]
idea_stress_tester = "idea_stress_tester.main:run"
run_crew = "idea_stress_tester.main:run"
train = "idea_stress_tester.main:train"
replay = "idea_stress_tester.main:replay"
test = "idea_stress_tester.main:test"
run_with_trigger = "idea_stress_tester.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "418fa8b9-12dd-4566-806b-f9eb35ca51d8"
